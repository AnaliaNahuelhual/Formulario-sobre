<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Seguridad Digital</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- COMIENZO DE HEADER -->
    <header class="header">
        <nav>
            <ul>
                <li><a href="index.html" class="active">Inicio</a></li>
                <li><a href="nosotros.html">Sobre nosotros</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="consejos.html">Consejos</a></li>
            </ul>
        </nav>
        <h1>Ciberseguridad y Resguardo Digital</h1>
        <p>Haga <strong>Click</strong> en el botón para abrir el formulario de consulta</p>
    </header>

    <!-- COMIENZO DE MAIN -->
    <main class="formulario">
        <!-- BOTÓN PARA ABRIR Y CERRAR -->
        <button id="open-btn" class="btn-primario" type="button">Abrir sobre</button>
        
        <!-- CONTENEDOR DEL SOBRE -->
        <div id="envelope" class="envelope-wrapper"></div>
        
        <!-- SOLAPA -->
        <div class="flap"></div>
        
        <!-- HOJA DEL FORMULARIO -->
        <form id="formulario-sobre" novalidate>
            <h2>Consulta de Seguridad</h2>
            <label for="nombre">Nombre/Empresa</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su email">
            
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escriba su consulta" rows="3"></textarea>
            
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
        <div class="pocket"></div>
    </main>

    <!-- COMIENZO FOOTER -->
    <footer>
        <p>Autora: Analia Nahuelhual</p>
        <p>Teléfono: <a href="tel:+54123456789" rel="nofollow noopener">+54 123456789</a></p>
        <p>Email: <button class="btn-revelar-email" data-usuario="contacto" data-dominio="sobreform.com">Haga clic para revelar el correo</button></p>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="app.js"></script>
</body>
</html>
